apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dataflow.fullname" . }}-rayjob-controller
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dataflow.fullname" . }}-rayjob-controller
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dataflow.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dataflow.fullname" . }}-rayjob-controller

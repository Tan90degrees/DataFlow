apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.fullname" . }}-api
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dataflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dataflow.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dataflow.apiServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "dataflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dataflow-api"]
          env:
            - name: DATAFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
            - name: DATAFLOW_METRICS_ENABLED
              value: {{ .Values.api.metricsEnabled | quote }}
            - name: DATAFLOW_API_AUTH_MODE
              value: {{ .Values.api.auth.mode | quote }}
            - name: DATAFLOW_API_AUTH_SUBJECT_CLAIM
              value: {{ .Values.api.auth.subjectClaim | quote }}
            - name: DATAFLOW_API_AUTH_ROLES_CLAIM
              value: {{ .Values.api.auth.rolesClaim | quote }}
            {{- if eq .Values.api.auth.mode "static" }}
            - name: DATAFLOW_API_AUTH_STATIC_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.auth.existingSecret is required for static auth" .Values.api.auth.existingSecret }}
                  key: {{ .Values.api.auth.staticTokensKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataflow.fullname" . }}-api
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dataflow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http

nameOverride: ""
fullnameOverride: ""

image:
  repository: dataflow-control-plane
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  apiName: ""
  controllerName: ""
  annotations: {}

database:
  existingSecret: ""
  urlKey: database-url

s3:
  endpointUrl: ""
  region: us-east-1
  existingSecret: ""
  accessKeyIdKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

api:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  auth:
    mode: disabled
    existingSecret: ""
    staticTokensKey: static-tokens
    subjectClaim: sub
    rolesClaim: roles
  metricsEnabled: true

controller:
  replicaCount: 2
  pollSeconds: 2
  standbyPollSeconds: 2
  metricsPort: 9091
  lockNamespace: 1145132097
  lockKey: 1
  maxRunsPerPass: 128
  retry:
    maxAttempts: 3
    initialBackoffSeconds: 30
    multiplier: 2
    maxBackoffSeconds: 600
  admission:
    globalLimit: ""
    profileLimits: "{}"
    maxNewPerPass: 32
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

revisionHistoryLimit: 3

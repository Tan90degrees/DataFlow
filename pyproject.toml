[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dataflow-orchestrator"
version = "0.1.0"
description = "Ray-native distributed data processing orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
runtime = ["ray[data]==2.58.0"]
control-plane = ["kubernetes>=30"]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
artifacts = ["boto3>=1.35,<2"]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
dataflow-runtime = "dataflow.cli:run_plan"
dataflow-render-rayjob = "dataflow.cli:render_rayjob"
dataflow-compile = "dataflow.cli:compile_pipeline_cli"
dataflow-migrate = "dataflow.metadata.migrations:main"
dataflow-api = "dataflow.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dataflow"]

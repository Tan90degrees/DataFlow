[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dataflow-orchestrator"
version = "0.2.0"
description = "Lightweight declarative pipelines for one shared Ray cluster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
# Ray probes fsspec's HTTP adapter even for local paths. Its optional imports
# must succeed when independent DAG actions first perform IO concurrently.
runtime = ["ray[data]==2.58.0", "fsspec[http]"]
dev = ["build>=1.2,<2", "pytest>=8.3,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[project.scripts]
dataflow-run = "dataflow.cli:run_pipeline_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dataflow"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "docs", "README.md", "README.zh-CN.md", "LICENSE", "pyproject.toml", "Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dataflow"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  single-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATAFLOW_TEST_RAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install single-cluster runtime
        run: python -m pip install -e '.[dev,runtime]'
      - name: Real Ray head and worker
        run: pytest tests/test_single_cluster_ray.py -v
  test:
    runs-on: ubuntu-latest
    env:
      DATAFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dataflow_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=dataflow --cov-report=term-missing

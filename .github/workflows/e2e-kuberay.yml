name: e2e-kuberay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-kuberay.yml"
      - "Dockerfile"
      - "Dockerfile.control-plane"
      - "e2e/kuberay/**"
      - "pyproject.toml"
      - "src/dataflow/**"

concurrency:
  group: e2e-kuberay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install kind v0.33.0
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Create Kubernetes cluster
        run: |
          kind create cluster \
            --name dataflow-e2e \
            --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          kubectl cluster-info

      - name: Install KubeRay 1.6.2
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          helm install kuberay-operator kuberay/kuberay-operator \
            --version 1.6.2 \
            --namespace kuberay-system \
            --create-namespace \
            --wait \
            --timeout 5m
          kubectl get crd rayjobs.ray.io rayclusters.ray.io
          kubectl get pods -n kuberay-system

      - name: Build DataFlow images
        run: |
          docker build -t dataflow-runtime:e2e -f Dockerfile .
          docker build -t dataflow-control-plane:e2e -f Dockerfile.control-plane .

      - name: Load images into kind
        run: |
          kind load docker-image --name dataflow-e2e dataflow-runtime:e2e
          kind load docker-image --name dataflow-e2e dataflow-control-plane:e2e

      - name: Run real KubeRay E2E
        env:
          DATAFLOW_E2E_WORKER_RESTART: "0"
        run: bash e2e/kuberay/run.sh

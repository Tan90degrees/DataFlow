name: release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - "Dockerfile.control-plane"
      - "charts/dataflow/**"
      - "docs/releases.md"
      - "pyproject.toml"
      - "src/dataflow/**"
      - "tests/test_release_contract.py"
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Install packaging dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate release version contract
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            dataflow-check-release "$GITHUB_REF_NAME"
          else
            dataflow-check-release
          fi

      - name: Build Python and Helm distributions
        run: |
          rm -rf dist
          python -m build --outdir dist
          helm lint charts/dataflow --set database.existingSecret=dataflow-db
          helm package charts/dataflow --destination dist
          (cd dist && sha256sum *.whl *.tar.gz *.tgz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Build release container images without publishing
        run: |
          docker build \
            --build-arg "DATAFLOW_BUILD_COMMIT=$GITHUB_SHA" \
            -t dataflow-runtime:release-check \
            -f Dockerfile .
          docker build \
            --build-arg "DATAFLOW_BUILD_COMMIT=$GITHUB_SHA" \
            -t dataflow-control-plane:release-check \
            -f Dockerfile.control-plane .

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Resolve immutable release coordinates
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        shell: bash
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable container images
        shell: bash
        run: |
          runtime="ghcr.io/$GHCR_OWNER/dataflow-runtime"
          control_plane="ghcr.io/$GHCR_OWNER/dataflow-control-plane"
          source="https://github.com/$GITHUB_REPOSITORY"

          docker build \
            --build-arg "DATAFLOW_BUILD_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$runtime:$VERSION" \
            -t "$runtime:sha-$GITHUB_SHA" \
            -f Dockerfile .
          docker build \
            --build-arg "DATAFLOW_BUILD_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$control_plane:$VERSION" \
            -t "$control_plane:sha-$GITHUB_SHA" \
            -f Dockerfile.control-plane .

          docker push "$runtime:$VERSION"
          docker push "$runtime:sha-$GITHUB_SHA"
          docker push "$control_plane:$VERSION"
          docker push "$control_plane:sha-$GITHUB_SHA"

      - name: Publish Helm chart to GHCR OCI registry
        run: helm push "dist/dataflow-$VERSION.tgz" "oci://ghcr.io/$GHCR_OWNER/charts"

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "DataFlow $VERSION" \
            --generate-notes

name: helm-chart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/helm-chart.yml"
      - "charts/dataflow/**"
      - "tests/helm/**"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint chart
        run: helm lint charts/dataflow --set database.existingSecret=dataflow-db
      - name: Verify deterministic rendered manifests
        run: |
          mkdir -p .artifacts/helm
          helm template dataflow charts/dataflow \
            --namespace dataflow \
            --set database.existingSecret=dataflow-db \
            --set s3.existingSecret=dataflow-s3 \
            > .artifacts/helm/render-1.yaml
          helm template dataflow charts/dataflow \
            --namespace dataflow \
            --set database.existingSecret=dataflow-db \
            --set s3.existingSecret=dataflow-s3 \
            > .artifacts/helm/render-2.yaml
          cmp .artifacts/helm/render-1.yaml .artifacts/helm/render-2.yaml
          python tests/helm/assert_render.py .artifacts/helm/render-1.yaml
      - name: Verify static-auth secret wiring
        run: |
          helm template dataflow charts/dataflow \
            --namespace dataflow \
            --set database.existingSecret=dataflow-db \
            --set api.auth.mode=static \
            --set api.auth.existingSecret=dataflow-api-auth \
            > .artifacts/helm/render-static.yaml
          python tests/helm/assert_render.py .artifacts/helm/render-static.yaml --static-auth

apiVersion: v1
kind: Service
metadata:
  name: dataflow-api
  namespace: dataflow-e2e
spec:
  type: NodePort
  selector:
    app: dataflow-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dataflow-e2e
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dataflow-e2e
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
